<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <title>WineSense | Selecionar Unidade</title>
  <link rel="stylesheet" href="../styleFix.css">
  <link rel="icon" href="../homeWineSense/img/LOGO-WINESENSE.png">
</head>

<body>
  <header class="cabecalho">
    <div></div>
    <nav>
      <ul class="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="../sobre/sobre.html">Sobre</a></li>
        <li><a href="../simulador-financeiro/simuladorFinanceiro.html">Simulador</a></li>
        <li><a href="#contato">Contato</a></li>
      </ul>
    </nav>
    <a href="../loginCad/cadastro.html">
      <button class="btn_entrar">Entrar</button>
    </a>
  </header>

  <a onclick="sair()" class="exit">➜</a>

  <div class="container cinza unidade_select">
    <h2>Escolha a Unidade</h2>
    <div class="unidades" id="listaUnidades"></div>
  </div>
</body>

<script>
  var nomeUsuario = sessionStorage.nomeUsuario || "Usuário";
  var cargoUsuario = sessionStorage.cargoUsuario || "";
  var empresaUsuario = sessionStorage.empresaUsuario || "";
  let grupoUsuario = sessionStorage.grupoUsuario;

  window.onload = function () {
    carregarUnidades(grupoUsuario);
  };

  function carregarUnidades(grupoUsuarioPar) {
    fetch(`/unidades/carunidades/${grupoUsuarioPar}`, { cache: 'no-store' })
      .then(function (response) {
        if (response.ok) {
          response.json().then(function (resposta) {
            console.log("Dados recebidos da API:", resposta);

            sessionStorage.setItem('dadosDashboard', JSON.stringify(resposta));

            if (cargoUsuario !== "adm") {
              localStorage.setItem("unidadeSelecionada", resposta[0].unidade);
              window.location.href = "dashboard.html";
              return;
            }

            renderizarUnidades(resposta);
          });
        } else {
          console.error('Nenhum dado encontrado ou erro na API');
        }
      })
      .catch(function (error) {
        console.error(`Erro na obtenção dos dados: ${error.message}`);
      });
  }

  function renderizarUnidades(listaUnidades) {
    var lista = document.getElementById("listaUnidades");
    lista.innerHTML = "";

    listaUnidades.forEach(function (unidadeObj) {
      var totalTanques = unidadeObj.tanques.length;

      var tanquesAlerta = unidadeObj.tanques.filter(function (t) {
        return t.status === "Crítico" || t.status === "Atenção";
      }).length;

      var corClasse = "";

      if (tanquesAlerta === 0) {
        corClasse = "verde";
      } else if (tanquesAlerta === 1) {
        corClasse = "amarelo";
      } else {
        corClasse = "vermelho";
      }

      var btn = document.createElement("button");
      btn.className = "btn_entrar";
      btn.style.margin = "10px";

      btn.innerHTML = `
        <div class="titulo_unidade">${unidadeObj.unidade}</div>
        <div class="info_unidade">Tanques: ${totalTanques}</div>
        <div class="info_unidade alerta ${corClasse}">
          Tanques com Alertas: ${tanquesAlerta}
        </div>
      `;

      btn.onclick = function () {
        localStorage.setItem("unidadeSelecionada", unidadeObj.unidade);
        window.location.href = "dashboard.html";
      };

      lista.appendChild(btn);
    });
  }

  function sair() {
    sessionStorage.clear();
    window.location.href = "../homeWineSense/index.html";
  }
</script>

</html>
