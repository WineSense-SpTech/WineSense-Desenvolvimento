<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BobIA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="header-dummy"></div> 
    
        <div class="header-titulo">BobIA</div>
    
        <div class="btn_sair">
            <button onclick="sair()">Sair</button>
        </div>
    </header>
    <div id="container">
        <h2 id="usuario"></h2>
        <textarea id="pergunta" type="text" placeholder="Digite a pergunta..."></textarea>
        <br><br>
        <button onclick="gerarResposta()">Gerar Resposta</button>
        <h3>Resposta da IA:</h3>
        <div id="resposta"></div>
    </div>

    <script>
        
        var nomeUsuario = sessionStorage.nomeUsuario;
        var cargoUsuario = sessionStorage.cargoUsuario || "";
        var empresaUsuario = sessionStorage.empresaUsuario || "";
        let grupoUsuario = sessionStorage.grupoUsuario;

        if (!nomeUsuario || !grupoUsuario) {
        alert("Acesso negado! Por favor, faça login de uma conta N3 para acessar esta página.");
        window.location.href = "../homeWineSense/index.html";
    }

        usuario.innerHTML = `Bem-vindo ${nomeUsuario}!`

        async function gerarResposta() {
            const pergunta = document.getElementById('pergunta').value;

            const response = await fetch('/perguntar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ pergunta })
            });

            const data = await response.json();

            resposta.style.display = 'block';
            document.getElementById('resposta').innerText = data.resultado;
        }

        function sair() {
      sessionStorage.clear();
      localStorage.clear();

      window.location.href = "../homeWineSense/index.html";
    }

    </script>
    
</body>
</html>
