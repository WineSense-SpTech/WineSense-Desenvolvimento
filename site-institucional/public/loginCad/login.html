<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WineSense | Login</title>

    <link rel="stylesheet" href="/styleFix.css">
    <link rel="icon" href="../homeWineSense/img/LOGO-WINESENSE.png">

</head>

<body>

<div class="navegacao">
        <div class="logo">
            <a href="index.html" class="logo"><img src="../homeWineSense/img/LOGO-WINESENSE.png" alt="Logo Wine"></a>
        </div>
        <header class="cabecalho">
            <nav>
                <ul class="menu">
                    <li><a href="../homeWineSense/index.html">Home</a></li>
                    <li><a href="../sobre/sobre.html">Sobre</a></li>
                    <li>
                        <a href="../simulador-financeiro/simuladorFinanceiro.html">Simulador</a>
                    </li>
                    <li><a href="../homeWineSense/index.html">Contato</a></li>
                </ul>
            </nav>
            <a href="../loginCad/cadastro.html">
                <button class="btn_entrar">Entrar</button>
            </a>
        </header>
    </div>

    <section class="auth">

        <div class="auth-box">

            <h1>Login</h1>

            <p>Acesse sua conta WineSense</p>

            <form>

                <input type="text" id="idEmpresa" placeholder="Cód da Empresa">

                <input type="email" id="idEmail" placeholder="Email">

                <input type="password" id="idSenha" placeholder="Senha">

                <button type="button" class="btn-primary" onclick="entrar()">Entrar</button>

            </form>

            <p class="auth-link">
                Não possui conta?
                <a href="cadastro.html">Criar conta</a>
            </p>

        </div>

    </section>

</body>
<script src="auth.js"></script>

</html>
