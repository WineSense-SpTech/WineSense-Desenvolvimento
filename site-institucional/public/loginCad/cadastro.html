<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>WineSense | Cadastro</title>

  <link rel="stylesheet" href="/styleFix.css" />
  <link rel="icon" href="../homeWineSense/img/LOGO-WINESENSE.png" />
</head>

<body>
  <div class="navegacao">
    <div class="logo">
      <a href="../homeWineSense/index.html" class="logo"><img src="../homeWineSense/img/LOGO-WINESENSE.png" alt="Logo Wine" /></a>
    </div>
    <header class="cabecalho">
      <nav class="header_login">
        <ul class="menu">
          <li><a href="../homeWineSense/index.html">Home</a></li>
          <li><a href="../sobre/sobre.html">Sobre</a></li>
          <li>
            <a href="../simulador-financeiro/simuladorFinanceiro.html">Simulador</a>
          </li>
          <li><a href="../homeWineSense/index.html#contato">Contato</a></li>
        </ul>
      </nav>
    </header>
  </div>

  <section class="auth">
    <div class="auth-box">
      <h1>Criar Conta</h1>

      <p>Cadastre-se na WineSense</p>

      <form>
        <input type="text" id="idEmpresa" placeholder="Cód da Empresa" />

        <input type="text" id="idNome" placeholder="Nome" />

        <input type="text" id="idSobrenome" placeholder="Sobrenome" />

        <input type="email" id="idEmail" placeholder="Email" />

        <input type="password" id="idSenha" placeholder="Senha" />

        <input type="password" id="idConfirmaSenha" placeholder="Confirmar senha" />

        <button type="button" class="btn-primary" onclick="cadastrar()">
          Cadastrar
        </button>
      </form>
      <div id="cardErro" style="display: none">
        <span id="mensagem_erro"></span>
      </div>

      <p class="auth-link">
        Já possui conta?
        <a href="login.html">Entrar</a>
      </p>
    </div>

    <div id="cardSucesso" style="display: none">
      <span id="mensagem_sucesso"></span>
    </div>
  </section>
</body>
<script src="auth.js"></script>

</html>
