<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Winesense</title>
    <link rel="stylesheet" href="stylegraph.css">
</head>
<body class="body">
    
    <div class="dashboard">
        <div class="header">
            <div>
                <h2 style="margin:0;">Temperatura</h2>
                <p>Adega 1, Vinhos : tinto</p>
            </div>
            <div class="temp-text" id="">12°C</div>
        </div>

        <div class="container-grafico">
            <svg id="svg-chart" viewBox="0 0 500 200" width="100%" height="100%">
                <line x1="0" y1="50" x2="500" y2="50" class="linhas-grafico" />
            <line x1="0" y1="100" x2="500" y2="100" class="linhas-grafico" />
            <line x1="0" y1="150" x2="500" y2="150" class="linhas-grafico" />
            
            <polyline id="temp-linha" points="" />

            </svg>

        </div>
    </div>

</body>
</html>
